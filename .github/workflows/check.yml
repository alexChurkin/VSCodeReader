name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-reader
          path: '*.vsix'
