name: Build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, strict types, unit tests and build
        run: npm run check
      - run: xvfb-run -a npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-reader
          path: vscode-reader-0.1.0.vsix
          if-no-files-found: error

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vscode-reader-release-0.1.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vscode-reader
          path: release-package
      - name: Update the single 0.1.0 release
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./.github/scripts/publish-release.cjs');
            const result = await publish({github, context});
            if (result.skipped) {
              core.info('A newer main commit exists; leaving its release unchanged.');
            } else {
              core.info(`Release: ${result.url}`);
              await core.summary.addLink('Download VSCodeReader 0.1.0', result.url).write();
            }
